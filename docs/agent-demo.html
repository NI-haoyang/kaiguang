<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>开机第一天 · Agent</title>
<style>
:root{
  --bg:#080b09; --panel:#0e1310; --panel2:#111815; --line:#1c2621; --line2:#27332c;
  --text:#e8efea; --dim:#8a9a91; --dim2:#5f6f66;
  --acc:#3ddc84; --acc2:#0f3a26; --warn:#f2c14e; --high:#ff6b6b; --blue:#5aa9f7;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);font:14px/1.65 "Segoe UI","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  display:flex;flex-direction:column;overflow:hidden}

.top{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);flex:0 0 auto}
.brand{display:flex;gap:12px;align-items:center}
.logo{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:19px;
  color:#04150c;background:linear-gradient(160deg,#5ff0a0,#28c06e);box-shadow:0 6px 18px rgba(61,220,132,.22)}
.top h1{margin:0;font-size:17px;letter-spacing:.5px}
.top p{margin:1px 0 0;font-size:12px;color:var(--dim)}
.pills{display:flex;gap:8px}
.pill{font-size:12px;color:var(--dim);border:1px solid var(--line2);border-radius:999px;padding:4px 11px;background:var(--panel)}
.pill.on{color:var(--acc);border-color:#1f4d36;background:#0d1f17}
.pill.acc{color:#9fe8c0;border-color:#1f4d36}

.grid{flex:1;display:grid;grid-template-columns:372px minmax(400px,1fr) 320px;gap:0;min-height:0}
.col{padding:18px;overflow:auto;min-height:0}
.left,.right{background:var(--panel);}
.left{border-right:1px solid var(--line)}
.right{border-left:1px solid var(--line)}
.mid{display:flex;flex-direction:column;padding:0;overflow:hidden}

.score-card{background:linear-gradient(170deg,#122019,#0d1411);border:1px solid var(--line2);border-radius:14px;padding:16px}
.score-head{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--dim)}
.tag{font-size:11px;padding:1px 8px;border-radius:999px;background:#132a1f;color:var(--acc);border:1px solid #1f4d36}
.score{display:flex;align-items:baseline;gap:4px;margin:6px 0 2px}
.score b{font:700 46px/1 var(--mono);color:var(--acc);letter-spacing:-2px}
.score i{font-style:normal;font-size:13px;color:var(--dim)}
.score-note{margin:6px 0 0;font-size:12.5px;color:var(--dim);line-height:1.6}

.metrics{margin-top:12px;border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2)}
.metric{display:flex;justify-content:space-between;padding:9px 13px;font-size:13px;border-bottom:1px solid var(--line)}
.metric:last-child{border-bottom:0}
.metric span{color:var(--dim)}
.metric b{font-family:var(--mono);font-weight:600}

.block{margin-top:18px}
.block h2{font-size:12px;font-weight:600;color:var(--dim);letter-spacing:.6px;margin:0 0 9px;text-transform:uppercase}
.hint{color:var(--dim2);font-weight:400;letter-spacing:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;padding:3px 9px;border-radius:7px;border:1px solid var(--line2);color:var(--dim);background:var(--panel2)}
.chip.high{color:#ffb4b4;border-color:#4a2222;background:#20100f}
.chip.warn{color:#f7d894;border-color:#4a3d1c;background:#1d1808}
.chip.ok{color:#9fe8c0;border-color:#1f4d36;background:#0d1f17}
.muted{color:var(--dim2);font-size:12.5px}
.small{font-size:11.5px;line-height:1.55}

.verify{border:1px solid var(--line);border-radius:10px;padding:11px 12px;background:var(--panel2)}
.verify.ok{border-color:#1f4d36}
.verify.high{border-color:#4a2222}
.verify.warn{border-color:#4a3d1c}
.verify b{display:block;font-size:13px;margin-bottom:3px}
.verify.ok b{color:var(--acc)} .verify.high b{color:#ff9d9d} .verify.warn b{color:var(--warn)}
.verify p{margin:0;font-size:12px;color:var(--dim);line-height:1.6}

/* 体检报告（左侧逐条列表） */
.report-block{margin-top:20px}
.legend{display:flex;flex-wrap:wrap;gap:10px;margin:-2px 0 10px;font-size:11px;color:var(--dim2)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:7px;height:7px;border-radius:50%;display:inline-block}
.legend i.high{background:var(--high)} .legend i.warn{background:var(--warn)}
.legend i.info{background:var(--blue)} .legend i.ok{background:var(--acc)}
.report{display:flex;flex-direction:column;gap:9px}
.fcard{border:1px solid var(--line);border-left:3px solid #2a3c33;border-radius:10px;background:var(--panel2);padding:10px 12px}
.fcard.high{border-left-color:var(--high)} .fcard.warn{border-left-color:var(--warn)}
.fcard.info{border-left-color:var(--blue)} .fcard.ok{border-left-color:#2f6b4a}
.fhead{display:flex;align-items:baseline;gap:8px}
.fhead h3{margin:0;flex:1;font-size:13px;font-weight:600;line-height:1.45}
.flevel{font-size:10.5px;padding:1px 6px;border-radius:5px;border:1px solid #24322b;color:var(--dim);white-space:nowrap}
.fcard.high .flevel{color:#ffb4b4;border-color:#4a2222;background:#20100f}
.fcard.warn .flevel{color:#f7d894;border-color:#4a3d1c;background:#1d1808}
.fcard.info .flevel{color:#a8d0f7;border-color:#24384a;background:#0d1620}
.fcard.ok .flevel{color:#9fe8c0;border-color:#1f4d36;background:#0d1f17}
.fdetail{margin:6px 0 0;font-size:12px;color:var(--dim);line-height:1.62}
.ffix{margin:6px 0 0;font-size:12px;color:#a9e6c4;line-height:1.6}
.ffix b{color:var(--acc);font-weight:600}
.fitems{display:flex;flex-wrap:wrap;gap:5px;margin-top:8px}
.fitem{font-size:10.5px;color:#8fb8a1;background:#0b1210;border:1px solid var(--line);border-radius:5px;padding:2px 6px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fcard .linkbtn{margin-top:9px}
.fcard .status{margin-top:6px}

.foot{margin:18px 0 0;font-size:11px;color:var(--dim2)}

/* thread */
.thread{flex:1;overflow:auto;padding:22px 26px 8px;scroll-behavior:smooth}
.msg{display:flex;gap:10px;margin-bottom:18px;max-width:640px}
.msg .av{flex:0 0 28px;height:28px;border-radius:9px;display:grid;place-items:center;font-size:12px;font-weight:700;
  background:#12251b;color:var(--acc);border:1px solid #1f4d36}
.msg .body{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:11px 14px;font-size:13.5px;line-height:1.72;white-space:pre-wrap}
.msg.user{flex-direction:row-reverse;margin-left:auto}
.msg.user .body{background:#10241a;border-color:#1f4d36;color:#d6f5e3}
.msg.user .av{background:#1a2a22;color:#9fe8c0;border-color:#2a3c33}

.opts{display:flex;flex-wrap:wrap;gap:7px;margin-top:10px}
.opt{font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid #2a3c33;background:#0f1a15;color:#c9e8d8;cursor:pointer;transition:.15s}
.opt:hover{border-color:var(--acc);color:var(--acc);background:#10241a}

/* cards */
.cards{display:flex;flex-direction:column;gap:10px;margin:4px 0 20px 38px;max-width:640px}
.card{border:1px solid var(--line2);border-radius:12px;background:var(--panel2);padding:12px 14px;transition:.18s;position:relative}
.card.pick{border-color:#2f6b4a;background:#0f1c15}
.card .row{display:flex;gap:10px;align-items:flex-start}
.box{flex:0 0 17px;width:17px;height:17px;margin-top:2px;border-radius:5px;border:1.5px solid #3a4a42;background:#0b1210;cursor:pointer;display:grid;place-items:center;transition:.15s}
.card.pick .box{background:var(--acc);border-color:var(--acc)}
.card.pick .box::after{content:"";width:9px;height:5px;border-left:2px solid #05170d;border-bottom:2px solid #05170d;transform:rotate(-45deg) translateY(-1px)}
.card.link .box{display:none}
.card h3{margin:0;font-size:13.5px;font-weight:600}
.card p{margin:5px 0 0;font-size:12.5px;color:var(--dim);line-height:1.62}
.meta{display:flex;gap:6px;margin-top:9px;flex-wrap:wrap}
.badge{font-size:11px;padding:1.5px 8px;border-radius:6px;border:1px solid #24322b;color:#8fb8a1;background:#0d1712}
.badge.rev{color:var(--acc);border-color:#1f4d36;background:#0d1f17}
.badge.warn{color:var(--warn);border-color:#4a3d1c;background:#1d1808}
.card.done{opacity:.9;border-color:#1f4d36}
.card.fail{border-color:#4a2222;background:#150e0e}
.status{font-size:12px;margin-top:8px;color:var(--dim)}
.status.ok{color:var(--acc)} .status.err{color:#ff9d9d}
.linkbtn{font-size:12px;padding:3px 10px;border-radius:7px;border:1px solid #2a3c33;background:#0f1a15;color:#c9e8d8;cursor:pointer;margin-top:9px}
.linkbtn:hover{border-color:var(--acc);color:var(--acc)}
.spin{display:inline-block;width:11px;height:11px;border:2px solid #2a3c33;border-top-color:var(--acc);border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
@keyframes sp{to{transform:rotate(360deg)}}

.actionbar{display:flex;gap:10px;align-items:center;margin:0 0 16px 38px;max-width:640px}
.btn{border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:9px;padding:8px 16px;font-size:13px;cursor:pointer;transition:.15s;font-family:inherit}
.btn:hover{border-color:#3a4a42}
.btn.primary{background:linear-gradient(160deg,#5ff0a0,#28c06e);color:#04150c;border:0;font-weight:600;box-shadow:0 5px 16px rgba(61,220,132,.18)}
.btn.primary:disabled{opacity:.45;box-shadow:none;cursor:not-allowed}
.btn.ghost{background:transparent}
.btn.sm{padding:4px 11px;font-size:12px}

.composer{display:flex;gap:10px;padding:14px 26px 16px;border-top:1px solid var(--line);background:#0a0f0c}
.composer input{flex:1;background:var(--panel2);border:1px solid var(--line2);border-radius:10px;padding:11px 14px;color:var(--text);font-size:13.5px;font-family:inherit;outline:none}
.composer input:focus{border-color:#2f6b4a}

/* log */
.log{display:flex;flex-direction:column;gap:9px}
.entry{border:1px solid var(--line);border-radius:10px;padding:9px 11px;background:var(--panel2);font-size:12.5px}
.entry .t{font-family:var(--mono);font-size:11px;color:var(--dim2)}
.entry .n{display:flex;justify-content:space-between;gap:8px;margin-top:2px}
.entry .n b{font-weight:600;font-size:12.5px;color:var(--text)}
.entry .d{color:var(--dim);font-size:11.5px;margin-top:3px;line-height:1.55}
.entry.ok{border-color:#1f4d36}
.entry.bad{border-color:#4a2222}
.entry .undo{font-size:11px;color:var(--acc);cursor:pointer;border:1px solid #1f4d36;border-radius:6px;padding:1px 7px;background:#0d1f17;white-space:nowrap}
.entry .undone{font-size:11px;color:var(--dim2)}
.orig{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.orig .o{font-family:var(--mono);font-size:11px;color:#7fae94;background:#0b1210;border:1px solid var(--line);border-radius:6px;padding:5px 8px;word-break:break-all;line-height:1.5}

/* scanning */
.scan{max-width:560px;margin:40px auto;padding:0 8px}
.scan h2{font-size:16px;margin:0 0 6px}
.scan .steps{margin-top:18px;display:flex;flex-direction:column;gap:9px}
.step{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--dim2);transition:.2s}
.step .dot{width:16px;height:16px;border-radius:50%;border:1.5px solid #2a3c33;display:grid;place-items:center;flex:0 0 16px}
.step.on{color:var(--text)}
.step.on .dot{border-color:var(--acc)}
.step.on .dot::after{content:"";width:7px;height:7px;border-radius:50%;background:var(--acc)}
.step.ok{color:#9fe8c0}
.step.ok .dot{border-color:var(--acc);background:var(--acc)}
.step.ok .dot::after{content:"";width:8px;height:4px;border-left:2px solid #05170d;border-bottom:2px solid #05170d;transform:rotate(-45deg)}
.empty{max-width:560px;margin:56px auto;padding:0 8px;text-align:center}
.empty h2{font-size:20px;margin:0 0 8px}
.empty p{color:var(--dim);font-size:13.5px;max-width:420px;margin:0 auto 22px;line-height:1.7}
.big{font-size:14px;padding:12px 26px}

/* Electron 桌面壳：窗口无边框，头部当拖动手柄，右侧留出系统按钮的位置 */
body.desktop .top{-webkit-app-region:drag;padding-right:150px}
body.desktop .top .pill,body.desktop .top button{-webkit-app-region:no-drag}
.hint{font-size:12px;color:var(--dim2)}
.demo-bar{flex:0 0 auto;display:flex;gap:10px;align-items:center;justify-content:center;padding:7px 14px;font-size:12.5px;color:#08150e;background:linear-gradient(90deg,#3ddc84,#7ff0b4)}
.demo-bar b{font-weight:700}
.demo-bar span{opacity:.78}
</style>
</head>
<body><div class="demo-bar"><b>静态演示</b><span>动作都是模拟的，不会碰你的电脑；能真动手、能撤销的是桌面版，见 Releases</span></div>
<header class="top">
  <div class="brand">
    <span class="logo">开</span>
    <div>
      <h1>开机第一天</h1>
      <p>新电脑开荒 · 先体检，再决定装什么</p>
    </div>
  </div>
  <div class="pills">
    <span class="pill" id="pillScan">未体检</span>
    <span class="pill" id="pillAI">AI 未连接</span>
    <span class="pill acc">动作可撤销</span>
  </div>
</header>

<main class="grid">
  <!-- 左：诊断 -->
  <aside class="col left">
    <section class="score-card" id="scoreCard">
      <div class="score-head"><span>开荒指数</span><span class="tag" id="scoreVerdictTag">待体检</span></div>
      <div class="score"><b id="score">--</b><i>分</i></div>
      <p class="score-note" id="scoreNote">先跑一遍体检，拿到这台机器的真实数字。</p>
    </section>

    <section class="metrics" id="metrics"></section>

    <section class="block">
      <h2>验机</h2>
      <div class="verify" id="verify"><p class="muted">还没验。</p></div>
    </section>

    <section class="block report-block">
      <h2>体检报告 <span class="hint" id="reportCount"></span></h2>
      <div class="legend">
        <span><i class="d high"></i>要处理</span><span><i class="d warn"></i>建议看看</span><span><i class="d info"></i>知道就行</span><span><i class="d ok"></i>没问题</span>
      </div>
      <div class="report" id="report"><p class="muted">先跑一遍体检，报告就出现在这里。</p></div>
    </section>

    <p class="foot">只读采集 · 本地分析 · 每步可撤销</p>
  </aside>

  <!-- 中：对话 -->
  <section class="col mid">
    <div class="thread" id="thread"></div>
    <div class="composer">
      <input id="input" type="text" placeholder="跟它说一句，或者点上面的选项" autocomplete="off">
      <button id="send" class="btn primary">发送</button>
    </div>
  </section>

  <!-- 右：执行日志 -->
  <aside class="col right">
    <section class="block">
      <h2>执行日志 <span class="hint" id="logCount"></span></h2>
      <div class="log" id="log"><p class="muted">还没有执行任何动作。</p></div>
    </section>
    <section class="block">
      <h2>原值记录</h2>
      <p class="muted small" id="origNote">执行前会先把原值记下来。撤销就是把原值写回去。</p>
      <div class="orig" id="orig"></div>
    </section>
    <p class="foot">失败即停 · 每一步都留痕</p>
  </aside>
</main>

<script>

const SIM = { journal: [], step: 0, lines: [], running: false, reported: false, started: 0 };
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
let seq = 0;

function detailOf(action) {
  if (action === 'open_settings') {
    return { ok: true, detail: '真机上会真的弹出系统设置页；这里是静态演示，只记一笔', ms: 300, revert: null };
  }
  if (action === 'disable_startup') {
    return { ok: true, detail: '已关闭（原条目还在注册表里，只是不启动了）', ms: 820, revert: { kind: 'reg', name: 'TX Mascot', value: 'C:\\Program Files\\ASUS\\TXMascot.exe' } };
  }
  return { ok: true, detail: '已卸载，需要时可以装回来', ms: 12400, revert: { kind: 'pkg', id: 'demo-pkg', value: 'winget install --id <演示包>' } };
}

const lastRun = {};
function execCard(card) {
  const key = card.action + '|' + card.title;
  const since = lastRun[key];
  if (since && Date.now() - since < 1500) {
    const dup = SIM.journal.filter((e) => e.action === card.action && e.title === card.title).pop();
    if (dup) return { ok: dup.ok, detail: dup.detail, ms: 120, entry: null };
  }
  lastRun[key] = Date.now();
  const d = detailOf(card.action);
  const entry = { id: 'demo' + (++seq), ts: Date.now(), action: card.action, title: card.title, ok: d.ok, detail: d.detail, revert: d.revert };
  SIM.journal.push(entry);
  return { ok: d.ok, detail: d.detail, ms: d.ms, entry };
}

window.fetch = async (url, opt) => {
  const p = String(url);
  const body = opt && opt.body ? JSON.parse(opt.body) : {};
  const j = (obj) => ({ ok: true, status: 200, json: async () => obj });

  if (p === '/api/state') {
    return j({ ai: false, scanning: SIM.running, ready: SIM.reported, report: SIM.reported ? DATA.report : null, analysis: SIM.reported ? DATA.analysis : null, journal: SIM.journal.slice() });
  }
  if (p === '/api/scan') {
    if (!SIM.running && !SIM.reported) {
      SIM.running = true; SIM.lines = []; SIM.started = Date.now();
      setTimeout(() => { SIM.reported = true; SIM.running = false; }, 2600);
    }
    return j({ ok: true });
  }
  if (p === '/api/scan/status') {
    if (SIM.running) {
      const n = Math.min(STEP_LABELS.length, Math.floor((Date.now() - SIM.started) / 320));
      SIM.lines = STEP_LABELS.slice(0, n);
    }
    return j({ running: SIM.running, lines: SIM.lines, error: null, ready: SIM.reported });
  }
  if (p === '/api/chat') {
    const text = String(body.text || '');
    if (!text) { SIM.step = 1; return j(DATA.greet); }
    if (SIM.step <= 1) { SIM.step = 2; return j(DATA.ask2); }
    // 任何时候说「留 WPS / 留 Office」都换一版卡片
    const isWps = /留\s*wps|wps.{0,4}(留|就行)/i.test(text);
    const isOffice = /留\s*office|office.{0,4}(留|就行)/i.test(text);
    if (isWps || isOffice) { SIM.step = 3; return j(DATA.variants[isWps ? 'wps' : 'office']); }
    if (SIM.step === 2) { SIM.step = 3; return j(DATA.variants.keep); }
    // 卡片出来以后可以追问；答案在构建时由真实的本地问答模块算好
    const hit = (DATA.answers || []).find(a => new RegExp(a.re, 'i').test(text));
    if (hit) return j({ say: hit.say });
    return j({ say: '静态演示只走到这里。桌面版会接着按你的回答挑动作，而且动手之前先把原值记下来。' });
  }
  if (p === '/api/execute') return j(execCard(body.card || {}));
  if (p === '/api/undo') {
    const e = SIM.journal.find((x) => x.id === body.id);
    if (e) e.undone = true;
    await sleep(180);
    return j({ ok: true, detail: '已恢复原样', ms: 210 });
  }
  if (p === '/api/journal') return j({ entries: SIM.journal.slice() });
  if (p === '/api/open') return j({ ok: true, uri: body.uri });
  if (p === '/api/settings') return j({ ok: true, hasKey: false, model: 'deepseek-flash' });
  return j({});
};

const el = (tag, cls, text) => { const n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; };

async function api(path, body) {
  // 本地服务只认自己页面下发的 token（页面里由服务端注入 window.KG_TOKEN）
  const headers = { 'Content-Type': 'application/json' };
  if (window.KG_TOKEN) headers['X-KG-Token'] = window.KG_TOKEN;
  const r = await fetch(path, body ? { method: 'POST', headers, body: JSON.stringify(body) } : { headers });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.detail || j.error || ('HTTP ' + r.status));
  return j;
}

  $('#reportCount').textContent = a.counts.high
    ? a.findings.length + ' 条 · ' + a.counts.high + ' 处要处理'
    : a.findings.length + ' 条 · 没有硬伤';

  const list = a.findings.slice().sort((x, y) => (LEVEL_ORDER[x.level] ?? 9) - (LEVEL_ORDER[y.level] ?? 9));
  if (!list.length) { box.append(el('p', 'muted', '没有发现需要处理的问题。')); return; }

  for (const f of list) {
    const c = el('article', 'fcard ' + (f.level || 'info'));
    const head = el('div', 'fhead');
    head.append(el('h3', null, f.title), el('span', 'flevel', LEVEL_TXT[f.level] || '记录'));
    c.append(head);
    if (f.detail) c.append(el('p', 'fdetail', f.detail));
    if (f.fix) {
      const p = el('p', 'ffix');
      p.append(el('b', null, '→ '), document.createTextNode(f.fix));
      c.append(p);
    }
    if (f.items && f.items.length) {
      const wrap = el('div', 'fitems');
      for (const t of f.items.slice(0, 8)) wrap.append(el('span', 'fitem', t));
      if (f.items.length > 8) wrap.append(el('span', 'fitem', '+' + (f.items.length - 8) + ' 个'));
      c.append(wrap);
    }
    if (f.action === 'open_settings') {
      const label = f.cta || '打开设置页';
      const btn = el('button', 'linkbtn', label);
      btn.onclick = async () => {
        btn.disabled = true; btn.textContent = '正在打开…';
        try {
          await api('/api/execute', { card: { action: 'open_settings', title: f.title, target: f.args || {} } });
          btn.textContent = '✓ 已打开';
          S.journal = (await api('/api/journal')).entries;
          renderLog();
        } catch (e) { btn.textContent = '打开失败'; }
        setTimeout(() => { btn.disabled = false; btn.textContent = label; }, 3500);
      };
      c.append(btn);
    }
    box.append(c);
  }
}

const ACTION_LABEL = { disable_startup: '关掉开机自启', uninstall_app: '卸载软件', open_settings: '打开设置页' };

function renderLog() {
  const box = $('#log');
  box.innerHTML = '';
  if (!S.journal.length) { box.append(el('p', 'muted', '还没有执行任何动作。')); $('#logCount').textContent = ''; return; }
  $('#logCount').textContent = S.journal.length + ' 条';
  for (const e of S.journal.slice().reverse()) {
    const box2 = el('div', 'entry ' + (e.ok ? 'ok' : 'bad'));
    const t = new Date(e.ts);
    box2.append(el('div', 't', t.toTimeString().slice(0, 8)));
    const row = el('div', 'n');
    row.append(el('b', null, e.title || ACTION_LABEL[e.action] || e.action));
    if (e.revert && !e.undone) {
      const u = el('span', 'undo', '撤销');
      u.onclick = () => undo(e.id, u);
      row.append(u);
    } else if (e.undone) row.append(el('span', 'undone', '已撤销'));
    box2.append(row, el('div', 'd', e.detail || ''));
    box.append(box2);
  }
  const orig = $('#orig');
  orig.innerHTML = '';
  for (const e of S.journal) {
    if (e.revert && e.revert.kind === 'reg') orig.append(el('div', 'o', e.revert.name + ' → ' + e.revert.value));
  }
  $('#origNote').textContent = S.journal.some(e => e.revert) ? '这些是改动前的原值。撤销就是把它们写回去。' : '执行前会先把原值记下来。撤销就是把原值写回去。';
}

/* ---------------- 对话 ---------------- */
function scroll() { const t = $('#thread'); t.scrollTop = t.scrollHeight; }

function bubble(role, text) {
  const m = el('div', 'msg ' + (role === 'user' ? 'user' : ''));
  m.append(el('div', 'av', role === 'user' ? '你' : '开'));
  const b = el('div', 'body', text);
  m.append(b);
  $('#thread').append(m);
  scroll();
  return m;
}

function chips(list, onClick) {
  const box = el('div', 'opts');
  for (const c of list) {
    const o = el('span', 'opt', c);
    o.onclick = () => { box.remove(); onClick(c); };
    box.append(o);
  }
  return box;
}

function send(text) {
  if (S.busy || !text.trim()) return;
  $('#input').value = '';
  bubble('user', text);
  S.busy = true;
  api('/api/chat', { text }).then(out => {
    const m = bubble('ai', out.say);
    if (out.ask) m.querySelector('.body').append(chips(out.ask.chips || ['好', '不用了'], send));
    if (out.cards) renderCards(out.cards, !out.keepPrev);
  }).catch(e => bubble('ai', '出错了：' + e.message)).finally(() => { S.busy = false; });
}

/* ---------------- 卡片 ---------------- */
function renderCards(cards, replace = true) {
  // 重新规划时替换上一组；问答里补的单条动作另起一组，不覆盖原清单
  if (replace) document.querySelectorAll('#thread .cards').forEach(n => n.remove());
  S.cards = cards; S.picked = new Set();
  const wrap = el('div', 'cards');
  if (!cards.length) {
    wrap.append(el('p', 'muted', '按你的数据，没有值得动的地方。'));
    $('#thread').append(wrap); scroll(); return;
  }
  cards.forEach((c, i) => {
    const isLink = c.action === 'open_settings';
    const box = el('div', 'card' + (isLink ? ' link' : '') + (isLink ? '' : ' pick'));
    const row = el('div', 'row');
    if (!isLink) {
      row.append(el('div', 'box'));
      S.picked.add(i);
      // 整张卡片都能点，不用非得戳那个小方块
      box.onclick = (e) => {
        if (e.target.closest('button, a')) return;
        if (S.picked.has(i)) { S.picked.delete(i); box.classList.remove('pick'); }
        else { S.picked.add(i); box.classList.add('pick'); }
        syncBar();
      };
    }
    const main = el('div');
    main.append(el('h3', null, c.title), el('p', null, c.why));
    const meta = el('div', 'meta');
    meta.append(el('span', 'badge ' + (isLink ? 'warn' : 'rev'), c.badge));
    if (!isLink) meta.append(el('span', 'badge', c.needAdmin ? '要你点一次 UAC' : '不需要管理员'));
    main.append(meta);
    if (isLink) {
      const b = el('button', 'linkbtn', '打开设置页');
      b.onclick = () => api('/api/open', { uri: c.target.uri }).then(() => {
        b.textContent = '已打开'; b.disabled = true;
        S.journal.unshift({ id: 'local' + Date.now(), ts: Date.now(), action: 'open_settings', title: c.title, ok: true, detail: '设置页已打开，等你点完', revert: null });
        renderLog();
      });
      main.append(b);
    }
    row.append(main);
    box.append(row);
    wrap.append(box);
    c._el = box;
  });

  const bar = el('div', 'actionbar');
  bar.id = 'bar';
  // 多组卡片时只让最新那个按钮持有 #go，旧的留在屏幕上但不再被选中
  document.querySelectorAll('#go').forEach(n => n.removeAttribute('id'));
  const go = el('button', 'btn primary', '执行选中的 0 项');
  go.id = 'go';
  go.onclick = executeSelected;
  S.goEl = go;
  bar.append(go, el('span', 'hint', '点卡片任意位置都能勾选 / 取消'));
  wrap.append(bar);
  $('#thread').append(wrap);
  scroll();
  syncBar();
}

function syncBar() {
  const go = S.goEl;
  if (!go) return;
  go.textContent = '执行选中的 ' + S.picked.size + ' 项';
  go.disabled = S.picked.size === 0;
}

async function executeSelected() {
  if (S.busy) return;
  S.busy = true;
  const go = S.goEl;
  go.disabled = true;
  const list = [...S.picked].map(i => S.cards[i]).filter(Boolean);
  let ok = 0, bad = 0;
  for (const c of list) {
    const box = c._el;
    const st = el('div', 'status');
    st.innerHTML = '<span class="spin"></span>执行中…';
    box.append(st);
    try {
      const r = await api('/api/execute', { card: { action: c.action, target: c.target, title: c.title } });
      box.classList.remove('fail', 'pick');
      box.classList.add(r.ok ? 'done' : 'fail');
      st.className = 'status ' + (r.ok ? 'ok' : 'err');
      st.textContent = (r.ok ? '✓ ' : '✕ ') + (r.detail || '') + '  ·  ' + (r.ms / 1000).toFixed(1) + 's' + (r.entry && r.entry.revert ? '  · 可撤销' : '');
      if (r.entry) S.journal.push(r.entry);
      r.ok ? ok++ : bad++;
      renderLog();
    } catch (e) {
      st.className = 'status err';
      st.textContent = '✕ ' + e.message;
      box.classList.add('fail');
      bad++;
      if (bad >= 1) { /* 失败即停 */ break; }
    }
  }
  S.busy = false;
  go.textContent = '完成 ' + ok + ' 条' + (bad ? '，' + bad + ' 条没成功' : '');
  go.disabled = true;

  const done = S.journal.filter(e => e.revert && !e.undone);
  if (done.length) {
    const bar = S.goEl.parentElement;
    const undoAll = el('button', 'btn ghost', '全部撤销（' + done.length + '）');
    undoAll.onclick = async () => {
      undoAll.disabled = true;
      undoAll.textContent = '正在撤销…';
      for (const e of done.slice().reverse()) {
        try { await api('/api/undo', { id: e.id }); } catch (x) {}
      }
      S.journal = (await api('/api/journal')).entries;
      renderLog();
      document.querySelectorAll('.card.done').forEach((box) => {
        box.classList.remove('done');
        const st = box.querySelector('.status');
        if (st) { st.className = 'status ok'; st.textContent = '↩ 已撤销，恢复原样'; }
      });
      undoAll.textContent = '已全部恢复';
      bubble('ai', '都退回去了，跟执行之前一样。这就是「做错的代价是三秒」。');
    };
    bar.append(undoAll);
  }
}

async function undo(id, btn) {
  btn.textContent = '…';
  try {
    const r = await api('/api/undo', { id });
    S.journal = (await api('/api/journal')).entries;
    renderLog();
    bubble('ai', '「' + (r.detail || '已恢复') + '」——这一条退回去了。');
  } catch (e) { btn.textContent = '撤销'; alert(e.message); }
}

/* ---------------- 体检流程 ---------------- */
function showScan() {
  const t = $('#thread');
  t.innerHTML = '';
  const box = el('div', 'scan');
  box.append(el('h2', null, '正在读这台机器'), el('p', 'muted', '只读采集，不改任何设置，不上传任何数据。'));
  const steps = el('div', 'steps');
  const refs = STEPS.map(s => {
    const d = el('div', 'step');
    d.append(el('div', 'dot'), el('span', null, s));
    steps.append(d);
    return d;
  });
  box.append(steps);
  t.append(box);
}

async function scanNow() {
  showScan();
  await api('/api/scan', {});
  const refs = [...document.querySelectorAll('.step')];
  const t = setInterval(async () => {
    const s = await api('/api/scan/status');
    const n = s.lines.length;
    refs.forEach((r, i) => { r.className = 'step' + (i < n ? ' ok' : i === n ? ' on' : ''); });
    if (!s.running) {
      clearInterval(t);
      refs.forEach(r => r.className = 'step ok');
      if (s.error) { bubble('ai', '体检没跑完：' + s.error); return; }
      const st = await api('/api/state');
      S.report = st.report; S.analysis = st.analysis; S.journal = st.journal || [];
      renderLeft(); renderLog();
      $('#thread').innerHTML = '';
      greet();
    }
  }, 400);
}

function emptyState() {
  const t = $('#thread');
  t.innerHTML = '';
  const box = el('div', 'empty');
  box.append(el('h2', null, '先给这台电脑做个体检'));
  box.append(el('p', null, '我会读一遍硬件、装了哪些软件、开机自启、后台服务和安全状态。大约 20 秒，只读，不联网。'));
  const b = el('button', 'btn primary big', '开始体检');
  b.onclick = scanNow;
  box.append(b);
  t.append(box);
}

async function greet() {
  const out = await api('/api/chat', { text: '' });
  const m = bubble('ai', out.say);
  if (out.ask) m.querySelector('.body').append(chips(out.ask.chips || [], send));
  if (out.cards) renderCards(out.cards);
}

async function boot() {
  const st = await api('/api/state');
  S.ai = !!st.ai; S.model = st.model;
  $('#pillAI').textContent = st.ai ? 'AI 已连接' : '本地规则';
  $('#pillAI').classList.toggle('on', !!st.ai);
  if (st.ready) {
    S.report = st.report; S.analysis = st.analysis; S.journal = st.journal || [];
    renderLeft(); renderLog();
    if (st.scanning) { showScan(); return scanNow(); }
    // 有缓存：直接进对话
    const last = S.journal.length;
    greet();
  } else {
    // 第一次打开：不等用户点，直接开始体检（双击到出报告 20 秒）
    emptyState();
    setTimeout(scanNow, 700);
  }
}

$('#pillAI').style.cursor = 'pointer';
$('#pillAI').title = '点一下填 DeepSeek API Key（只存本机）';
$('#pillAI').onclick = async () => {
  if (S.ai) { bubble('ai', 'AI 已经连着了，用的是 ' + (S.model || 'deepseek-flash') + '。想换 key 就删掉 %LOCALAPPDATA%\\Kaiguang\\settings.json 里的 apiKey，再点这里。'); return; }
  const k = prompt('粘贴 DeepSeek API Key。\n只写进本机 %LOCALAPPDATA%\\Kaiguang\\settings.json，不会上传，也不会写进报告。');
  if (!k || !k.trim()) return;
  const r = await api('/api/settings', { key: k.trim() });
  if (r && r.ok) {
    S.ai = true; S.model = r.model;
    $('#pillAI').textContent = 'AI 已连接';
    $('#pillAI').classList.add('on');
    bubble('ai', '连上了。接下来按你这台机器的真实数据说话，不再走本地规则。');
  } else {
    bubble('ai', '这个 key 没存进去，再试一次。');
  }
};

$('#send').onclick = () => send($('#input').value);
$('#input').addEventListener('keydown', e => { if (e.key === 'Enter') send($('#input').value); });

boot().catch(e => { document.body.append(el('p', null, '启动失败：' + e.message)); });
</script>
